<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет | Инновационный колледж</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<div class="app-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="/img/logo.png" alt="IT COLLEGE" style="height: 40px; width: auto; max-width: 100%; object-fit: contain;">
    </div>
    <div class="user-info" id="userInfo">
      <div class="user-avatar"><i class="fas fa-user"></i></div>
      <div class="user-details">
        <div class="user-name" id="userName">Загрузка...</div>
        <div class="user-role" id="userRole">...</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Nav items injected by JS -->
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Выйти</button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <div class="main-content">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
      <div class="page-title" id="pageTitle">Главная</div>
      <div class="topbar-actions" style="display:flex; align-items:center; gap:20px;">
        <div class="notification-bell" id="notificationBell" style="position:relative; cursor:pointer;">
          <i class="fas fa-bell" style="font-size:1.2rem; color:var(--text-muted);"></i>
          <span id="notifCount" style="position:absolute; top:-5px; right:-5px; background:var(--danger); color:#fff; font-size:0.7rem; padding:2px 5px; border-radius:10px; display:none;">0</span>
        </div>
        <a href="/" target="_blank" class="btn-home"><i class="fas fa-globe"></i> На сайт</a>
      </div>
    </header>
    
    <main class="content-area" id="contentArea">
      <!-- Dynamic content injected here -->
      <div class="loader-container"><div class="spinner"></div></div>
    </main>
  </div>
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Заголовок</h3>
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- Modal content injected here -->
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="/js/modules/api.js"></script>
<script src="/js/modules/notifications.js"></script>
<script src="/js/modules/grades.js"></script>
<script src="/js/modules/attendance.js"></script>
<script src="/js/modules/schedule.js"></script>
<script src="/js/modules/lessons.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
