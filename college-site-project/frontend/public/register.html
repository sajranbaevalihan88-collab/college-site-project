<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | Инновационный колледж</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- TODO: стили дублируются с логином, надо объединить в один файл -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f5f7fa; color: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 0; }
    .auth-container { width: 100%; max-width: 500px; padding: 20px; }
    .auth-card { background: #fff; border-radius: 12px; padding: 40px 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header svg { width: 40px; height: 40px; stroke: #F9A826; stroke-width: 2; margin-bottom: 10px; }
    .auth-header h2 { font-size: 1.5rem; color: #0F3460; font-weight: 700; }
    .auth-header p { font-size: 0.9rem; color: #64748b; margin-top: 5px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; color: #64748b; }
    .form-control { width: 100%; padding: 10px 15px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; font-size: 1rem; transition: border-color 0.3s; }
    .form-control:focus { outline: none; border-color: #0F3460; box-shadow: 0 0 0 3px rgba(15,52,96,0.1); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn { display: block; width: 100%; padding: 14px; background: #0F3460; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.3s; margin-top: 20px;}
    .btn:hover { background: #1A4B85; }
    .error-msg { color: #e53e3e; font-size: 0.85rem; margin-top: 5px; display: none; }
    .success-msg { color: #38a169; font-size: 0.9rem; margin-top: 15px; display: none; text-align: center; font-weight: 500; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #64748b; }
    .auth-footer a { color: #0F3460; font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/img/logo.png" alt="IT COLLEGE" style="height: 50px; margin-bottom: 10px;">
      <h2>Регистрация студента</h2>
      <p>Создайте аккаунт для доступа к платформе</p>
    </div>
    <form id="registerForm">
      <div class="grid-2">
        <div class="form-group">
          <label>Фамилия *</label>
          <input type="text" id="lastName" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Имя *</label>
          <input type="text" id="firstName" class="form-control" required>
        </div>
      </div>
      <div class="form-group">
        <label>Отчество</label>
        <input type="text" id="patronymic" class="form-control">
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Пароль *</label>
        <div style="position:relative;">
          <input type="password" id="regPass" class="form-control" required minlength="6">
          <i class="fas fa-eye-slash" id="togglePass" style="position:absolute; right:10px; top:12px; cursor:pointer; color:var(--text-muted)"></i>
        </div>
        <div id="passStrength" style="font-size:0.8rem; margin-top:5px; font-weight:600;"></div>
      </div>
      
      <div class="form-group">
        <label>Желаемая группа (если знаете)</label>
        <input type="text" id="regGroup" class="form-control" placeholder="Например: ПКС-1-26">
      </div>

      <div class="error-msg" id="regError"></div>
      <div id="successMsg" class="success-msg">Регистрация успешна! Ожидайте подтверждения от администрации. Через 3 секунды вы будете перенаправлены на страницу входа.</div>
      
      <button type="submit" class="btn" id="submitBtn">Зарегистрироваться</button>
      
      <div class="auth-links">
        <a href="/login.html">Уже есть аккаунт? <strong>Войти</strong></a><br>
        <a href="/"><i class="fas fa-arrow-left"></i> На главную</a>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const togglePass = document.getElementById('togglePass');
  const passInput = document.getElementById('regPass');
  const passStrength = document.getElementById('passStrength');
  
  togglePass.addEventListener('click', () => {
    const type = passInput.type === 'password' ? 'text' : 'password';
    passInput.type = type;
    togglePass.className = type === 'password' ? 'fas fa-eye-slash' : 'fas fa-eye';
  });

  passInput.addEventListener('input', (e) => {
    const val = e.target.value;
    if(!val) { passStrength.textContent = ''; return; }
    let score = 0;
    if(val.length >= 8) score++;
    if(/[A-Z]/.test(val)) score++;
    if(/[0-9]/.test(val)) score++;
    if(/[^A-Za-z0-9]/.test(val)) score++;
    
    if(score < 2) {
      passStrength.textContent = 'Простой пароль';
      passStrength.style.color = 'var(--danger)';
    } else if(score < 4) {
      passStrength.textContent = 'Средний пароль';
      passStrength.style.color = 'var(--warning)';
    } else {
      passStrength.textContent = 'Надёжный пароль';
      passStrength.style.color = 'var(--success)';
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('regError');
    const successMsg = document.getElementById('successMsg');
    
    btn.disabled = true;
    errorMsg.style.display = 'none';
    
    const payload = {
      email: document.getElementById('email').value,
      password: document.getElementById('regPass').value,
      first_name: document.getElementById('firstName').value,
      last_name: document.getElementById('lastName').value,
      patronymic: document.getElementById('patronymic').value,
      group_name: document.getElementById('regGroup').value
    };
    
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      
      if (!res.ok) {
        errorMsg.textContent = data.error;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        return;
      }
      
      successMsg.style.display = 'block';
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 3000);
      
    } catch (err) {
      errorMsg.textContent = 'Ошибка подключения к серверу';
      errorMsg.style.display = 'block';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
